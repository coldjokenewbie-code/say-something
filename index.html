<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12100e" />
    <meta name="description" content="Say Something — 用說的,讓 AI 幫你寫好文字" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Say Something</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1 class="brand"><span class="brand-mark">●</span> Say <em>Something</em></h1>
        <div class="topbar-actions">
          <select id="model-select" class="model-select" title="AI 模型"></select>
          <button id="settings-btn" class="icon-btn" title="設定" aria-label="設定">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <nav class="modes" id="mode-bar" aria-label="輸出模式"></nav>

      <main class="panes">
        <section class="pane">
          <div class="pane-head">
            <span class="pane-title">你說的話</span>
            <button id="clear-btn" class="text-btn">清除</button>
          </div>
          <textarea id="transcript" placeholder="按下方麥克風開始說話,或直接在這裡輸入文字…"></textarea>
        </section>

        <section class="pane">
          <div class="pane-head">
            <span class="pane-title">AI 潤飾結果</span>
            <span class="pane-tools">
              <button id="rerun-btn" class="text-btn">重新生成</button>
              <button id="copy-btn" class="text-btn">複製</button>
            </span>
          </div>
          <div id="result" class="result" aria-live="polite">
            <span class="placeholder">結果會顯示在這裡</span>
          </div>
        </section>
      </main>

      <footer class="dock">
        <div id="status" class="status">準備好了,按一下開始說話</div>
        <button id="mic-btn" class="mic" aria-label="開始/停止錄音">
          <svg class="mic-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <details class="history-box">
          <summary>歷史紀錄</summary>
          <ul id="history-list"></ul>
        </details>
      </footer>
    </div>

    <dialog id="settings-dialog" class="settings">
      <form method="dialog">
        <h2>設定</h2>

        <label class="field">
          <span>Anthropic API Key(Claude 模型)</span>
          <input type="password" id="anthropic-key" placeholder="sk-ant-..." autocomplete="off" />
          <small>到 <a href="https://platform.claude.com/" target="_blank" rel="noopener">platform.claude.com</a> 取得</small>
        </label>

        <label class="field">
          <span>Gemini API Key(Gemini 模型)</span>
          <input type="password" id="gemini-key" placeholder="AIza..." autocomplete="off" />
          <small>到 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 取得</small>
        </label>

        <label class="field">
          <span>語音輸入方式</span>
          <select id="input-method">
            <option value="auto">自動(即時辨識,失敗時改用錄音)</option>
            <option value="record">錄音模式(錄完交給 Gemini 轉錄+潤飾)</option>
          </select>
          <small>Edge(Mac)、Firefox、Brave 的即時辨識常不可用,會自動切到錄音模式</small>
        </label>

        <label class="field">
          <span>語音辨識語言</span>
          <select id="speech-lang">
            <option value="zh-TW">中文(台灣)</option>
            <option value="zh-CN">中文(普通話)</option>
            <option value="yue-Hant-HK">廣東話</option>
            <option value="en-US">English (US)</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
          </select>
        </label>

        <label class="field">
          <span>輸出語言</span>
          <select id="output-lang">
            <option value="same">跟隨原文</option>
            <option value="繁體中文">繁體中文</option>
            <option value="English">English</option>
            <option value="日本語">日本語</option>
          </select>
        </label>

        <p class="privacy-note">API key 只儲存在這台裝置的瀏覽器裡,直接傳給 Anthropic / Google,不會經過其他伺服器。</p>

        <div class="dialog-actions">
          <button value="save" class="primary-btn">儲存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
